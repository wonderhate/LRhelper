name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            studio/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install and build
        shell: pwsh
        run: ./scripts/setup-studio.ps1
      - name: Studio tests
        run: npm --prefix studio test
      - name: Lightroom MCP type check and tests
        shell: pwsh
        run: |
          npm --prefix server run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix server test -- --runInBand
      - name: Native Lua controller tests
        shell: pwsh
        run: |
          python -m pip install lupa==2.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python studio/tests/lua-workbench.py
      - name: Build and exercise the Windows installer
        shell: pwsh
        run: |
          ./scripts/build-studio-release.ps1
          $archive = Get-ChildItem build/studio -Filter '*.zip' | Select-Object -ExpandProperty FullName
          powershell.exe -NoProfile -File studio/tests/windows-release-smoke.ps1 -Package $archive
