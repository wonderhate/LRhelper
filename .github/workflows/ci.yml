name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24.19.0']
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            studio/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install and build
        shell: pwsh
        run: ./scripts/setup-studio.ps1
      - name: Studio tests
        run: npm --prefix studio test
      - name: Lightroom MCP type check and tests
        shell: pwsh
        run: |
          npm --prefix server run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix server run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix server test -- --runInBand
      - name: Live-kit unit tests
        run: node --test "tests/e2e/live/unit/*.test.mjs"
      - name: Native Lua controller tests
        shell: pwsh
        run: |
          python -m pip install lupa==2.8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python studio/tests/lua-workbench.py
      - name: Build and exercise the Windows installer
        if: matrix.node == '24.19.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/build-studio-release.ps1
          ./scripts/test-studio-release.ps1
  lua:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Bundled skill tests
        working-directory: skills/raw-photo-lightroom-preset
        run: python3 -m unittest discover -s tests -v
      - name: Run Lua 5.1 specs
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1 lua-busted
          lua5.1 /usr/bin/busted
      - name: Run Selene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.32.0 -R Kampfkarren/selene -p selene-0.32.0-linux.zip -D "$RUNNER_TEMP"
          printf '%s  %s\n' d3773393578580074386e69337d35b7acddfbaa9fc38964c07fa3e28436ade9b "$RUNNER_TEMP/selene-0.32.0-linux.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/selene-0.32.0-linux.zip" -d "$RUNNER_TEMP/selene"
          chmod +x "$RUNNER_TEMP/selene/selene"
          "$RUNNER_TEMP/selene/selene" plugin/LightroomMCP.lrplugin
