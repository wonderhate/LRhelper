name: Publish Windows Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: windows-package-${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  publish:
    if: github.repository == 'wonderhate/LRhelper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.0
      - name: Verify and mirror the Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          archive="LR-Codex-Studio-$version-Windows-x64.zip"
          target="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          mkdir -p "$RUNNER_TEMP/lrhelper"
          cd "$RUNNER_TEMP/lrhelper"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern "$archive.sha256"
          expected="$(cut -d ' ' -f 1 "$archive.sha256")"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check
          if [[ "$RELEASE_TAG" == "v1.0.0" ]]; then
            [[ "$expected" == "e5d8344d8f1ac0d3ffea3ce43af401f7b7bc2f113974a264fb8fd42ce6d232e1" ]]
          else
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/build-release.yml@refs/tags/$RELEASE_TAG"
            commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
            python3 - "$archive" "$version" "$RELEASE_TAG" "$commit" <<'PY'
          import hashlib, json, sys, zipfile
          archive, version, tag, commit = sys.argv[1:]
          with zipfile.ZipFile(archive) as package:
              manifest = json.loads(package.read("app/release.json"))
              assert manifest["schema"] == 2 and manifest["version"] == version
              assert manifest["platform"] == "win32" and manifest["arch"] == "x64"
              assert manifest["source"] == {"tag": tag, "commit": commit}
              payload = [name for name in package.namelist() if name.startswith("app/") and name != "app/release.json"]
              assert len(payload) == len(manifest["files"]) and len(set(payload)) == len(payload)
              for name in payload:
                  assert hashlib.sha256(package.read(name)).hexdigest() == manifest["files"][name[4:]]
          PY
          fi
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "$target" \
            --artifact-type application/vnd.wonderhate.lrhelper.windows.v1+zip \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=LRhelper Windows x64 installer and SHA-256 checksum" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            --annotation "org.opencontainers.image.version=$version" \
            --annotation "org.opencontainers.image.documentation=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            "$archive:application/zip" "$archive.sha256:text/plain"
          digest="$(oras resolve "$target")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          immutable="${target%:*}@$digest"
          oras pull "$immutable" --output "$RUNNER_TEMP/lrhelper-verified"
          cmp "$archive" "$RUNNER_TEMP/lrhelper-verified/$archive"
          cmp "$archive.sha256" "$RUNNER_TEMP/lrhelper-verified/$archive.sha256"
          printf 'Verified package: `%s`\n\nImmutable reference: `%s`\n\nZIP SHA-256: `%s`\n' "$target" "$immutable" "$expected" >> "$GITHUB_STEP_SUMMARY"
