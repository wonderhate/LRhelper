name: Publish Windows Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: windows-package-${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  publish:
    if: github.repository == 'wonderhate/LRhelper'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
        with:
          version: 1.3.0
      - name: Verify and mirror the Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          archive="LR-Codex-Studio-$version-Windows-x64.zip"
          target="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          mkdir -p "$RUNNER_TEMP/lrhelper"
          cd "$RUNNER_TEMP/lrhelper"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern "$archive.sha256"
          expected="$(cut -d ' ' -f 1 "$archive.sha256")"
          [[ "$expected" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "$target" \
            --artifact-type application/vnd.wonderhate.lrhelper.windows.v1+zip \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=LRhelper Windows x64 installer and SHA-256 checksum" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            --annotation "org.opencontainers.image.version=$version" \
            --annotation "org.opencontainers.image.documentation=https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            "$archive:application/zip" "$archive.sha256:text/plain"
          oras pull "$target" --output "$RUNNER_TEMP/lrhelper-verified"
          cmp "$archive" "$RUNNER_TEMP/lrhelper-verified/$archive"
          cmp "$archive.sha256" "$RUNNER_TEMP/lrhelper-verified/$archive.sha256"
          printf 'Verified package: `%s`\n\nZIP SHA-256: `%s`\n' "$target" "$expected" >> "$GITHUB_STEP_SUMMARY"
